apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab
  namespace: argocd
spec:
  description: Projeto para aplicações do homelab
  sourceRepos:
    - 'https://github.com/joao-calado/homelab.git'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: 'Namespace'
    - group: 'networking.k8s.io'
      kind: 'Ingress'
    - group: 'traefik.io'
      kind: 'IngressRoute'
    - group: 'traefik.io'
      kind: 'ServersTransport'
    - group: 'traefik.io'
      kind: 'Middleware'
    - group: 'traefik.io'
      kind: 'TLSOption'
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRole'
    - group: 'rbac.authorization.k8s.io'
      kind: 'ClusterRoleBinding'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  signatureKeys: []
  orphanedResources:
    warn: true